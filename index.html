<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EME 2028 Conference</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
.logo img {
  height: 80px;
}
    
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: #fff;
      height: 100vh;
      background: url('moon.jpg') no-repeat center center/cover;
    }

    /* overlay */
    .overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
      top: 0;
      left: 0;
      z-index: 0;
    }

    /* NAVBAR */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: flex;
      gap: 45px;
      padding: 10px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      z-index: 2;
      flex-wrap: wrap;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 0.9em;
      opacity: 0.85;
      transition: 0.3s;
    }

    nav a:hover {
      opacity: 1;
      text-shadow: 0 0 5px #fff;
    }

    /* CONTENT */
    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
      padding: 20px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5em;
      margin-bottom: 10px;
      letter-spacing: 3px;
    }

    h2 {
      font-weight: 300;
      margin-bottom: 30px;
      opacity: 0.85;
    }

    .tagline {
      font-size: 1.2em;
      margin-bottom: 10px;
    }

    .footer {
      margin-top: 30px;
      font-size: 0.9em;
      opacity: 0.6;
    }

    @media (max-width: 700px) {
      nav {
        gap: 10px;
      }
      h1 {
        font-size: 2.2em;
      }
    }

  </style>
</head>

<body>

<div class="overlay"></div>

<nav>
  <div class="logo">
    <img src="logo-eme2028.png" alt="EME 2028 Logo">
  </div>
  <a href="#">Location</a>
  <a href="#">Program</a>
  <a href="#">Participants</a>
  <a href="#">Activities</a>
  <a href="#">Sponsors</a>
  <a href="#">Tours Info</a>
  <a href="#">Catering</a>
  <a href="#">Hotel</a>
  <a href="#">Places to Visit</a>
</nav>

<div class="container">
  <h1>EME 2028</h1>
  <h2>Earth–Moon–Earth Conference</h2>

  <p class="tagline">Exploring radiowave communication via lunar reflection</p>
  <p class="tagline">Official website coming soon</p>

  <div class="footer">
    © 2028 EME Conference
  </div>
</div>

</body>
</html>
