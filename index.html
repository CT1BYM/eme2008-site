<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EME 2028 Conference</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      background: url('moon.jpg') no-repeat center center/cover;
    }

    /* camada escura para melhorar leitura */
    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      top: 0;
      left: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 800px;
      padding: 20px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5em;
      margin-bottom: 10px;
      letter-spacing: 3px;
    }

    h2 {
      font-weight: 300;
      margin-bottom: 30px;
      opacity: 0.85;
    }

    .tagline {
      font-size: 1.2em;
      margin-bottom: 15px;
      opacity: 0.9;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.9em;
      opacity: 0.6;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2.2em; }
      h2 { font-size: 1.1em; }
    }
  </style>
</head>

<body>

<div class="overlay"></div>

<div class="container">
  <h1>EME 2028</h1>
  <h2>Earth–Moon–Earth Conference</h2>

  <p class="tagline">
    Exploring microwave communication via lunar reflection
  </p>

  <p class="tagline">
    Official website coming soon
  </p>

  <div class="footer">
    © 2028 EME Conference
  </div>
</div>

</body>
</html>
